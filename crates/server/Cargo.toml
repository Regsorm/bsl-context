[package]
name = "bsl-context-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP-сервер контекста платформы 1С — HTTP-точка входа"

[[bin]]
name = "bsl-context-rs"
path = "src/main.rs"

[dependencies]
platform-index = { path = "../platform-index", version = "0.22.0" }
bsl-validator  = { path = "../bsl-validator", version = "0.22.0" }
symbol-source  = { path = "../symbol-source", version = "0.22.0" }
lite-index     = { path = "../lite-index", version = "0.22.0" }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
rmcp = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
sysinfo = "0.32"

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
# Обход корпуса в регресс-тесте `corpus_config_objects` (только тесты).
walkdir = { workspace = true }
# Изолированный каталог под PID-файл в тестах замка.
tempfile = "3"
# HTTP-клиент для сквозной проверки MCP-протокола через настоящий axum router.
ureq = { version = "2", features = ["json"] }
